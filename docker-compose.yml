services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - BACKEND_URL=http://backend:8000
    # depends_on:
    #   backend:
    #     condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_URL=http://frontend:3005
      - OLLAMA_URL=http://host.docker.internal:11434
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/myapp
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # healthcheck:
    #   test: curl --fail http://localhost:8000/health || exit 1
    #   interval: 2s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 5s
    networks:
      - app-network

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=myapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge